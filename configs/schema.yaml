$schema: "https://json-schema.org/draft/2020-12/schema"
oneOf:
  - title: "ETHPredict v2 hierarchical meta-labeling config"
    type: object
    required:
      - version
      - experiment
      - data
      - targets
      - validation
      - labels
      - model
      - training
      - costs
      - alpha_backtest
      - search
    properties:
      version:
        const: 2
      experiment:
        type: object
        required: [id, seed, trials]
        properties:
          id:
            type: string
          name:
            type: string
          seed:
            type: integer
          trials:
            type: integer
            minimum: 1
      data:
        type: object
        required: [dir, granularity, sources]
        properties:
          dir:
            type: string
          granularity:
            type: string
          sources:
            type: array
            items:
              type: string
          lighter:
            type: object
          bar_type:
            enum: [time, volume, dollar, tick]
          side_data:
            type: object
            properties:
              groups:
                type: object
                additionalProperties: false
                properties:
                  funding:
                    $ref: '#/$defs/sideDataSource'
                  mark_basis:
                    $ref: '#/$defs/sideDataSource'
                  open_interest:
                    $ref: '#/$defs/sideDataSource'
                  exchange_volume:
                    $ref: '#/$defs/sideDataSource'
                  order_book:
                    $ref: '#/$defs/sideDataSource'
                  trade_flow:
                    $ref: '#/$defs/sideDataSource'
      bars:
        type: object
        properties:
          type:
            enum: [time, volume, dollar, tick]
          time_interval:
            type: string
          threshold_volume:
            type: number
            exclusiveMinimum: 0
          threshold_usd:
            type: number
            exclusiveMinimum: 0
          threshold_ticks:
            type: integer
            minimum: 1
          min_rows:
            type: integer
            minimum: 1
          max_missing_fraction:
            type: number
            minimum: 0
            maximum: 1
          min_rows_per_split:
            type: object
            additionalProperties:
              type: integer
              minimum: 1
      features:
        type: object
        properties:
          frac_diff_order:
            type: number
            minimum: 0
            maximum: 1
          frac_diff_mode:
            type: string
            enum: [fixed_width, fixed-width, fixed, none, disabled, auto]
          frac_diff_threshold:
            type: number
            exclusiveMinimum: 0
          include:
            type: array
            minItems: 1
            items:
              type: string
      targets:
        type: object
        required: [horizons]
        properties:
          horizons:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              required: [bars]
              properties:
                bars:
                  type: integer
                  minimum: 1
      validation:
        type: object
        required: [method, folds, test_fraction, purge_bars, embargo_bars]
        properties:
          method:
            enum: [purged_walk_forward, exact_span_walk_forward, purged_kfold, grouped_scenario]
          embargo_mode:
            enum: [fixed_bars, max_horizon, sequence_plus_horizon, realized_t1, volatility_adaptive]
          meta_inner_folds:
            type: integer
            minimum: 1
          scenario_test_groups:
            type: integer
            minimum: 1
          max_scenarios:
            type: integer
            minimum: 1
          min_train_rows:
            type: integer
            minimum: 1
          min_validation_rows:
            type: integer
            minimum: 1
          folds:
            type: integer
            minimum: 1
          test_fraction:
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 1
          purge_bars:
            type: integer
            minimum: 0
          embargo_bars:
            type: integer
            minimum: 0
      sample_weights:
        type: object
        properties:
          base_mode:
            type: string
            enum: [uniform, horizon_span_uniqueness, triple_barrier_t1_uniqueness, return_magnitude, combined_uniqueness_return]
          meta_mode:
            type: string
            enum: [uniform, horizon_span_uniqueness, triple_barrier_t1_uniqueness, return_magnitude, combined_uniqueness_return]
          normalize:
            anyOf:
              - type: string
                enum: [sum_one, mean_one, none, raw, sum, unit_sum, mean, unit_mean]
              - type: boolean

      labels:
        type: object
        required: [meta_triple_barrier]
        properties:
          meta_triple_barrier:
            type: object
            required: [profit_kappa, stop_kappa, vertical_barriers, min_edge_bps, cost_mode]
            properties:
              profit_kappa:
                type: number
                exclusiveMinimum: 0
              stop_kappa:
                type: number
                exclusiveMinimum: 0
              geometry:
                enum: [symmetric, asymmetric]
              success_mode:
                enum: [positive_net_at_vertical, profit_take_only]
              intrabar_ordering:
                enum: [stop_first, profit_first, exclude]
              vertical_barriers:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
              volatility_window:
                type: integer
                minimum: 1
              min_edge_bps:
                type: number
                minimum: 0
              cost_mode:
                type: string
      model:
        type: object
        required: [base, meta_labeler]
        properties:
          type:
            type: string
          base:
            type: object
            required: [type]
            properties:
              type:
                enum: [lstm, linear, tree, zero, mean]
              hidden_size:
                type: integer
                minimum: 1
              num_layers:
                type: integer
                minimum: 1
              dropout:
                type: number
                minimum: 0
          meta_labeler:
            type: object
            required: [type]
            properties:
              type:
                enum: [constant, logistic, tree, mlp]
              hidden_size:
                type: integer
                minimum: 1
              num_layers:
                type: integer
                minimum: 1
              dropout:
                type: number
                minimum: 0
              calibration:
                type: object
                properties:
                  method:
                    enum: [none, platt, isotonic]
                  validation_fraction:
                    type: number
                    exclusiveMinimum: 0
                    exclusiveMaximum: 1
              selection:
                type: object
                properties:
                  enabled:
                    type: boolean
                  models:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      enum: [constant, logistic, tree, mlp]
                  metric:
                    enum: [brier_score, log_loss]
                  validation_fraction:
                    type: number
                    exclusiveMinimum: 0
                    exclusiveMaximum: 1
              enabled:
                type: boolean
      candidate_mapping:
        type: object
        properties:
          mode:
            enum: [raw_sign, probability_sign, expected_edge, volatility_scaled_edge, horizon_agreement]
          min_scaled_edge:
            type: number
      training:
        type: object
        required: [sequence_length, epochs, batch_size, learning_rate]
        properties:
          target_standardization:
            enum: [none, standard]
          gradient_clip_norm:
            type: number
            exclusiveMinimum: 0
          ensemble_seeds:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              minimum: 0
              maximum: 4294967295
          bootstrap:
            enum: [none, bootstrap, sequential_bootstrap]
          early_stopping:
            type: object
            properties:
              enabled:
                type: boolean
              patience:
                type: integer
                minimum: 1
              min_delta:
                type: number
                minimum: 0
              validation_fraction:
                type: number
                exclusiveMinimum: 0
                exclusiveMaximum: 1
              min_rows:
                type: integer
                minimum: 1
          sequence_length:
            type: integer
            minimum: 1
          epochs:
            type: integer
            minimum: 1
          batch_size:
            type: integer
            minimum: 1
          learning_rate:
            type: number
            exclusiveMinimum: 0
          weight_decay:
            type: number
            minimum: 0
          loss_weights:
            type: object
      feature_importance:
        type: object
        properties:
          enabled:
            type: boolean
          noise_features:
            type: integer
            minimum: 0
          repeats:
            type: integer
            minimum: 1
          max_folds:
            type: integer
            minimum: 1
          max_base_features:
            type: integer
            minimum: 1
          base_features:
            type: array
            items:
              type: string
          single_feature:
            type: boolean
          ablation_groups:
            type: array
            items:
              type: string
      costs:
        type: object
        properties:
          mode:
            enum: [static, stress, dynamic]
          stress_multiplier:
            type: number
            minimum: 0
          dynamic_funding:
            type: object
          dynamic_spread:
            type: object
          dynamic_slippage:
            type: object
          execution:
            type: object
            properties:
              mode:
                enum: [taker, maker, hybrid]
              fill_policy:
                enum: [expected_haircut, sampled]
              entry_delay_bars:
                type: integer
                minimum: 0
              maker_fill_probability:
                type: number
                minimum: 0
                maximum: 1
              missed_fill_probability:
                type: number
                minimum: 0
                maximum: 1
          fee_bps:
            type: number
            minimum: 0
          spread_bps:
            type: number
            minimum: 0
          slippage_bps:
            type: number
            minimum: 0
          funding_bps_per_hour:
            type: number
      alpha_backtest:
        type: object
        required: [initial_capital, meta_threshold, edge_threshold_bps]
        properties:
          initial_capital:
            type: number
            minimum: 0
          horizon:
            type: string
          meta_threshold_selection:
            type: object
            properties:
              enabled:
                type: boolean
              metric:
                enum: [f1, validation_net_pnl]
              min_trades:
                type: integer
                minimum: 0
          meta_threshold_grid:
            type: array
            minItems: 1
            items:
              type: number
              minimum: 0
              maximum: 1
          meta_threshold:
            type: number
            minimum: 0
            maximum: 1
          edge_threshold_bps:
            type: number
            minimum: 0
          position_sizing:
            type: string
          position_notional:
            type: number
            minimum: 0
          max_position_notional:
            type: number
            minimum: 0
      search:
        type: object
        required: [mode]
        properties:
          mode:
            enum: [grid, shuffled_grid, random, log_uniform]
          seed:
            type: integer
            minimum: 0
          max_trials:
            type: integer
            minimum: 1
          spaces:
            type: object
          trials:
            type: array
            items:
              type: object
      research:
        type: object
        properties:
          final_test_guard:
            type: object
            properties:
              do_not_reuse_test:
                type: boolean
              evaluate:
                type: boolean
              ledger_path:
                type: string
              evaluate_selection_roles:
                type: array
                items:
                  type: string
          raw_data_guard:
            type: object
            properties:
              on_change:
                type: string
                enum:
                  - warn
                  - fail
                  - ignore
              registry_path:
                type: string
      tracking:
        type: object
        properties:
          trackio:
            type: object
            properties:
              enabled:
                type: boolean
              allow_local_debug_without_trackio:
                type: boolean
              project:
                type: string
              auto_log_gpu:
                type: boolean
              gpu_log_interval:
                type: number
                exclusiveMinimum: 0
              auto_log_cpu:
                type: boolean
              cpu_log_interval:
                type: number
                exclusiveMinimum: 0
      pipeline:
        type: object
      execution:
        type: object
      smoke:
        type: object
  - title: "Legacy ETHPredict config"
    not:
      required: [version]
    type: object
    required:
      - experiment
      - bars
      - features
      - model
    properties:
      experiment:
        type: object
        required:
          - id
          - seed
          - trials
        properties:
          id:
            type: string
          seed:
            type: integer
          trials:
            type: integer
      bars:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - time
              - tick
              - volume
              - dollar
          threshold_usd:
            type: number
          threshold_ticks:
            type: integer
          threshold_volume:
            type: number
          time_interval:
            type: string
            pattern: ^[0-9]+[mhd]$
      features:
        type: object
        required:
          - frac_diff_order
          - include
        properties:
          frac_diff_order:
            type: number
            minimum: 0
            maximum: 1
          include:
            type: array
            items:
              type: string
      model:
        type: object
        properties:
          level0:
            type: object
            properties:
              algo:
                type: string
                enum:
                  - xgboost
                  - lightgbm
                  - catboost
                  - lstm
              params:
                type: object
          base:
            type: object
          meta_labeling:
            type: boolean
      market_maker:
        type: object
      backtest:
        type: object

$defs:
  sideDataSource:
    type: object
    properties:
      enabled:
        type: boolean
      historical:
        const: true
      paths:
        type: array
        minItems: 1
        items:
          type: string
      timestamp_column:
        type: string
      timestamp_unit:
        enum: [s, ms, us, ns]
      available_at_column:
        type: string
      available_at_unit:
        enum: [s, ms, us, ns]
      availability_delay:
        type: string
      tolerance:
        type: string
      columns:
        type: object
        additionalProperties:
          type: string
      min_source_rows:
        type: integer
        minimum: 2
      min_coverage:
        type: number
        minimum: 0
        maximum: 1
      min_split_coverage:
        type: number
        minimum: 0
        maximum: 1
      fill_policy:
        enum: [reject, zero_with_indicator]
    if:
      properties:
        enabled:
          const: false
      required: [enabled]
    else:
      required: [paths, historical]
      anyOf:
        - required: [available_at_column]
        - required: [availability_delay]
